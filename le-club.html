<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Le club – Twirling Bâton Trets</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/inject-header.js" defer></script>

  <section class="hero wrap">
    <h1>Le club</h1>
    <p id="clubIntro">
      Chargement…
    </p>
  </section>

  <main class="wrap">
    <section class="card" style="display:grid; gap:2px;">

      <h2>Présentation</h2>
      <div id="clubPresentation">
        <p>Chargement…</p>
      </div>

      <h2>Encadrement et fonctionnement</h2>
      <div id="clubEncadrement">
        <p>Chargement…</p>
      </div>

      <h2>Histoire du club</h2>
      <div id="clubHistoire">
        <p>Chargement…</p>
      </div>

    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/inject-footer.js" defer></script>

  <script>
    (function(){

      var intro =
        document.getElementById("clubIntro");

      var presentation =
        document.getElementById("clubPresentation");

      var encadrement =
        document.getElementById("clubEncadrement");

      var histoire =
        document.getElementById("clubHistoire");


      function escapeHtml(value) {

        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");

      }


      function sanitizeHtml(content) {

        if (!content) {
          return "";
        }

        var parser = new DOMParser();

        var doc =
          parser.parseFromString(
            "<div>" + String(content) + "</div>",
            "text/html"
          );

        var wrapper =
          doc.body.firstElementChild;

        if (!wrapper) {
          return "";
        }

        wrapper
          .querySelectorAll(
            "script, style, iframe, object, embed, form"
          )
          .forEach(function(element){
            element.remove();
          });


        wrapper
          .querySelectorAll("*")
          .forEach(function(element){

            Array
              .from(element.attributes)
              .forEach(function(attribute){

                var name =
                  attribute.name.toLowerCase();

                var value =
                  attribute.value
                    .trim()
                    .toLowerCase();


                if (
                  name.indexOf("on") === 0
                ) {
                  element.removeAttribute(
                    attribute.name
                  );
                }


                if (
                  (
                    name === "href" ||
                    name === "src"
                  ) &&
                  value.indexOf(
                    "javascript:"
                  ) === 0
                ) {
                  element.removeAttribute(
                    attribute.name
                  );
                }

              });

          });

        return wrapper.innerHTML;

      }


      fetch("assets/club.json")

        .then(function(response){

          if (!response.ok) {

            throw new Error(
              "Impossible de charger assets/club.json"
            );

          }

          return response.json();

        })

        .then(function(data){

          intro.innerHTML =
            escapeHtml(
              data.intro || ""
            );

          presentation.innerHTML =
            sanitizeHtml(
              data.presentation || ""
            );

          encadrement.innerHTML =
            sanitizeHtml(
              data.encadrement || ""
            );

          histoire.innerHTML =
            sanitizeHtml(
              data.histoire || ""
            );

        })

        .catch(function(error){

          console.error(error);

          intro.textContent =
            "Impossible de charger les informations du club.";

          presentation.innerHTML = "";
          encadrement.innerHTML = "";
          histoire.innerHTML = "";

        });

    })();
  </script>

</body>
</html>
