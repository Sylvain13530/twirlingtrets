<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Galerie – Twirling Bâton Trets</title>
  <link rel="stylesheet" href="styles.css" />

  <style>
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    .gallery-item {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }

    .gallery-item img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .gallery-message {
      grid-column: 1 / -1;
      text-align: center;
      color: #64748b;
      padding: 24px;
    }
  </style>
</head>

<body>

  <div id="site-header"></div>
  <script src="assets/inject-header.js" defer></script>

  <section class="hero wrap">
    <h1>Galerie</h1>
    <p>Quelques moments du club en images.</p>
  </section>

  <main class="wrap">
    <div id="gallery" class="gallery-grid">
      <p class="gallery-message">
        Chargement de la galerie…
      </p>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="assets/inject-footer.js" defer></script>


  <script>
    (function(){

      var root =
        document.getElementById("gallery");

      function escapeAttr(value) {

        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");

      }


      fetch("assets/galerie.json")

        .then(function(response){

          if (!response.ok) {

            throw new Error(
              "Impossible de charger assets/galerie.json"
            );

          }

          return response.json();

        })

        .then(function(items){

          if (
            !Array.isArray(items) ||
            !items.length
          ) {

            root.innerHTML =
              '<p class="gallery-message">' +
              'Aucune photo dans la galerie.' +
              '</p>';

            return;
          }


          var photos =
            items
              .map(function(item){
                return item && item.image
                  ? item.image
                  : "";
              })
              .filter(Boolean);


          if (!photos.length) {

            root.innerHTML =
              '<p class="gallery-message">' +
              'Aucune photo dans la galerie.' +
              '</p>';

            return;
          }


          root.innerHTML =
            photos.map(function(src){

              return (
                '<figure class="gallery-item">' +
                  '<img ' +
                    'src="' +
                    escapeAttr(src) +
                    '" ' +
                    'alt="Photo du club" ' +
                    'loading="lazy" ' +
                  '/>' +
                '</figure>'
              );

            }).join("");

        })

        .catch(function(error){

          console.error(error);

          root.innerHTML =
            '<p class="gallery-message">' +
            'Impossible de charger la galerie.' +
            '</p>';

        });

    })();
  </script>

</body>
</html>
