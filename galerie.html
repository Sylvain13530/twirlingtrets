<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Galerie – Twirling Bâton Trets</title>
  <link rel="stylesheet" href="styles.css" />

  <style>
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    .gallery-item {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }

    .gallery-item img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
    }

    .gallery-message {
      grid-column: 1 / -1;
      text-align: center;
      color: #64748b;
      padding: 24px;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 92vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
    }

    .lb-close,
    .lb-prev,
    .lb-next {
      position: fixed;
      background: rgba(255,255,255,.14);
      color: #fff;
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 999px;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 22px;
      user-select: none;
    }

    .lb-close {
      top: 20px;
      right: 20px;
    }

    .lb-prev {
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
    }

    .lb-next {
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
    }

    .lb-counter {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      background: rgba(0,0,0,.4);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 14px;
      font-weight: 700;
    }

    @media (max-width:700px) {
      .lb-prev,
      .lb-next {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div id="site-header"></div>
  <script src="assets/inject-header.js" defer></script>

  <section class="hero wrap">
    <h1>Galerie</h1>
    <p>Quelques moments du club en images.</p>
  </section>

  <main class="wrap">
    <div id="gallery" class="gallery-grid">
      <p class="gallery-message">
        Chargement de la galerie…
      </p>
    </div>
  </main>

  <div
    id="lightbox"
    class="lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Agrandissement photo"
  >
    <button
      id="lbClose"
      class="lb-close"
      aria-label="Fermer"
    >
      ✕
    </button>

    <button
      id="lbPrev"
      class="lb-prev"
      aria-label="Photo précédente"
    >
      ‹
    </button>

    <img
      id="lbImg"
      src=""
      alt="Photo du club"
    />

    <button
      id="lbNext"
      class="lb-next"
      aria-label="Photo suivante"
    >
      ›
    </button>

    <div
      id="lbCount"
      class="lb-counter"
    >
      1 / 1
    </div>
  </div>

  <div id="site-footer"></div>
  <script src="assets/inject-footer.js" defer></script>

  <script>
    (function(){

      var root =
        document.getElementById("gallery");

      var lightbox =
        document.getElementById("lightbox");

      var lbImg =
        document.getElementById("lbImg");

      var lbClose =
        document.getElementById("lbClose");

      var lbPrev =
        document.getElementById("lbPrev");

      var lbNext =
        document.getElementById("lbNext");

      var lbCount =
        document.getElementById("lbCount");

      var photos = [];
      var currentIndex = 0;


      function escapeAttr(value) {

        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");

      }


      function openAt(index) {

        if (!photos.length) {
          return;
        }

        currentIndex =
          (index + photos.length) %
          photos.length;

        lbImg.src =
          photos[currentIndex];

        lbCount.textContent =
          (currentIndex + 1) +
          " / " +
          photos.length;

        lightbox.classList.add("open");

      }


      function closeLightbox() {

        lightbox.classList.remove("open");
        lbImg.src = "";

      }


      function previousPhoto() {
        openAt(currentIndex - 1);
      }


      function nextPhoto() {
        openAt(currentIndex + 1);
      }


Promise.all([
  fetch("assets/galerie.json").then(function(response){

    if (!response.ok) {
      throw new Error(
        "Impossible de charger assets/galerie.json"
      );
    }

    return response.json();
  }),

  fetch("assets/actualites.json").then(function(response){

    if (!response.ok) {
      throw new Error(
        "Impossible de charger actualites.json"
      );
    }

    return response.json();
  })
])

.then(function(results){

  var galerieItems = results[0];
  var actualites = results[1];

  var media = [];


  /*
   * Photos ajoutées directement
   * dans la Galerie
   */

  if (Array.isArray(galerieItems)) {

    galerieItems.forEach(function(item){

      if (item && item.image) {

        media.push({
          type: "image",
          src: item.image
        });

      }

    });

  }


  /*
   * Photos + vidéos provenant
   * automatiquement des actualités
   */

  if (Array.isArray(actualites)) {

    actualites.forEach(function(actualite){


      if (Array.isArray(actualite.images)) {

        actualite.images.forEach(function(src){

          if (src) {

            media.push({
              type: "image",
              src: src
            });

          }

        });

      }


      if (Array.isArray(actualite.videos)) {

        actualite.videos.forEach(function(src){

          if (src) {

            media.push({
              type: "video",
              src: src
            });

          }

        });

      }

    });

  }


  /*
   * Suppression des doublons
   */

  var seen = {};

  media = media.filter(function(item){

    if (
      !item.src ||
      seen[item.type + "|" + item.src]
    ) {
      return false;
    }

    seen[item.type + "|" + item.src] = true;

    return true;

  });


  if (!media.length) {

    root.innerHTML =
      '<p class="gallery-message">' +
      'Aucun média dans la galerie.' +
      '</p>';

    return;

  }


  /*
   * On conserve uniquement les images
   * dans le tableau utilisé par la lightbox
   */

  photos = media
    .filter(function(item){
      return item.type === "image";
    })
    .map(function(item){
      return item.src;
    });


  var photoIndex = 0;


  root.innerHTML =
    media.map(function(item){

      if (item.type === "video") {

        return (
          '<figure class="gallery-item">' +

            '<video ' +
              'controls ' +
              'preload="metadata" ' +
              'style="' +
                'width:100%;' +
                'height:220px;' +
                'object-fit:contain;' +
                'display:block;' +
                'background:#000' +
              '">' +

              '<source src="' +
                escapeAttr(item.src) +
              '">' +

              'Votre navigateur ne peut pas lire cette vidéo.' +

            '</video>' +

          '</figure>'
        );

      }


      var currentPhotoIndex =
        photoIndex++;

      return (
        '<figure class="gallery-item">' +

          '<img ' +
            'src="' +
              escapeAttr(item.src) +
            '" ' +
            'alt="Photo du club" ' +
            'loading="lazy" ' +
            'data-index="' +
              currentPhotoIndex +
            '" ' +
          '/>' +

        '</figure>'
      );

    }).join("");

})

.catch(function(error){

  console.error(error);

  root.innerHTML =
    '<p class="gallery-message">' +
    'Impossible de charger la galerie.' +
    '</p>';

});


      root.addEventListener(
        "click",
        function(event){

          var target = event.target;

          if (
            target &&
            target.tagName === "IMG"
          ) {

            openAt(
              Number(
                target.getAttribute(
                  "data-index"
                )
              )
            );

          }

        }
      );


      lbClose.addEventListener(
        "click",
        function(event){

          event.stopPropagation();
          closeLightbox();

        }
      );


      lbPrev.addEventListener(
        "click",
        function(event){

          event.stopPropagation();
          previousPhoto();

        }
      );


      lbNext.addEventListener(
        "click",
        function(event){

          event.stopPropagation();
          nextPhoto();

        }
      );


      lightbox.addEventListener(
        "click",
        function(event){

          if (event.target === lightbox) {
            closeLightbox();
          }

        }
      );


      document.addEventListener(
        "keydown",
        function(event){

          if (
            !lightbox.classList.contains("open")
          ) {
            return;
          }

          if (event.key === "Escape") {
            closeLightbox();
          }

          if (event.key === "ArrowLeft") {
            previousPhoto();
          }

          if (event.key === "ArrowRight") {
            nextPhoto();
          }

        }
      );

    })();
  </script>

</body>
</html>
