media:
  - name: actualites
    label: Images des actualités
    input: assets/actus
    output: /assets/actus
    rename: safe

  - name: galerie
    label: Images de la galerie
    input: assets/galerie
    output: /assets/galerie
    rename: safe


content:

  # =========================
  # ACTUALITÉS
  # =========================

  - name: actualites
    label: Actualités
    type: file
    path: actualites-2026.json
    format: json
    list: true

    fields:
      - name: date
        label: Date
        type: date
        required: true

      - name: titre
        label: Titre
        type: string
        required: true

      - name: resume
        label: Texte de l'actualité
        type: rich-text
        required: true
        options:
          format: html
          media: actualites
          path: assets/actus
          rename: safe
          switcher: false

      - name: images
        label: Photos
        type: image
        list: true
        required: false
        options:
          media: actualites
          path: assets/actus
          rename: safe

      - name: lien
        label: Lien Facebook
        type: string
        required: false


  # =========================
  # CALENDRIER
  # =========================

  - name: calendrier
    label: Calendrier
    type: file
    path: assets/calendrier.json
    format: json
    list: true

    fields:
      - name: date_debut
        label: Date de début
        type: date
        required: true

      - name: date_fin
        label: Date de fin
        type: date
        required: false

      - name: nom
        label: Compétition / événement
        type: string
        required: true

      - name: lieu
        label: Lieu
        type: string
        required: false


  # =========================
  # GALERIE
  # =========================

  - name: galerie
    label: Galerie
    type: file
    path: assets/galerie.json
    format: json
    list: true

    fields:
      - name: image
        label: Photo
        type: image
        required: true
        options:
          media: galerie
          path: assets/galerie
          rename: safe

  # =========================
  # SPONSORS
  # =========================

  - name: sponsors
    label: Sponsors
    type: file
    path: assets/sponsors.json
    format: json
    list: true

    fields:
      - name: nom
        label: Nom
        type: string
        required: true

      - name: image
        label: Logo
        type: image
        required: true
        options:
          media: galerie
          path: assets
          rename: safe

      - name: lien
        label: Site internet
        type: string
        required: false