media:
  - name: actualites
    label: Images des actualités
    input: assets/actus
    output: /assets/actus
    rename: safe

  - name: galerie
    label: Images de la galerie
    input: assets/galerie
    output: /assets/galerie
    rename: safe

  - name: sponsors
    label: Logos des sponsors
    input: assets/sponsors
    output: /assets/sponsors
    rename: safe
    
  - name: videos
    label: Vidéos des actualités
    input: assets/videos
    output: /assets/videos
    rename: safe
    categories: [video]
    
  - name: inscriptions
    label: Images inscriptions
    input: assets/inscriptions
    output: /assets/inscriptions
    rename: safe
    
content:

  # =========================
  # ACTUALITÉS
  # =========================

  - name: actualites
    label: Actualités
    type: file
    path: actualites-2026.json
    format: json
    list: true

    fields:
      - name: date
        label: Date
        type: date
        required: true

      - name: titre
        label: Titre
        type: string
        required: true

      - name: resume
        label: Texte de l'actualité
        type: rich-text
        required: true
        options:
          format: html
          media: actualites
          path: assets/actus
          rename: safe
          switcher: false

      - name: images
        label: Photos
        type: image
        required: false
        options:
          media: actualites
          path: assets/actus
          multiple:
            max: 50
          unique: true
          rename: safe

      - name: videos
        label: Vidéos
        type: file
        required: false
        options:
          media: videos
          path: assets/videos
          categories: [video]
          multiple:
            max: 10
          unique: true
          rename: safe

      - name: lien
        label: Lien Facebook
        type: string
        required: false


  # =========================
  # CALENDRIER
  # =========================

  - name: calendrier
    label: Calendrier
    type: file
    path: assets/calendrier.json
    format: json
    list: true

    fields:
      - name: date_debut
        label: Date de début
        type: date
        required: true

      - name: date_fin
        label: Date de fin
        type: date
        required: false

      - name: nom
        label: Compétition / événement
        type: string
        required: true

      - name: lieu
        label: Lieu
        type: string
        required: false
        
      - name: actif
        label: Afficher sur le site
        type: boolean
        required: true
        default: true

  # =========================
  # GALERIE
  # =========================

  - name: galerie
    label: Galerie
    type: file
    path: assets/galerie.json
    format: json
    list: true

    fields:
      - name: image
        label: Photo
        type: image
        required: true
        options:
          media: galerie
          path: assets/galerie
          rename: safe
  # =========================
  # SPONSORS
  # =========================

  - name: sponsors
    label: Sponsors
    type: file
    path: assets/sponsors.json
    format: json
    list: true

    fields:
      - name: nom
        label: Nom
        type: string
        required: true

      - name: categorie
        label: Catégorie
        type: select
        required: true
        options:
          values:
            - value: annuel
              label: Sponsor annuel
            - value: evenement
              label: Partenaire évènementiel

      - name: image
        label: Logo
        type: image
        required: false
        options:
          media: sponsors
          path: assets/sponsors
          rename: safe

      - name: lien
        label: Site internet / réseau social
        type: string
        required: false

      - name: style
        label: Présentation
        type: select
        required: true
        options:
          values:
            - value: normal
              label: Logo normal
            - value: texte
              label: Nom uniquement
            - value: fond-bleu
              label: Logo sur fond bleu
  # =========================
  # LE CLUB
  # =========================

  - name: club
    label: Le club
    type: file
    path: assets/club.json
    format: json

    fields:
      - name: intro
        label: Texte d'introduction
        type: string
        required: true

      - name: presentation
        label: Présentation
        type: rich-text
        required: true
        options:
          format: html
          switcher: false

      - name: encadrement
        label: Encadrement et fonctionnement
        type: rich-text
        required: true
        options:
          format: html
          switcher: false

      - name: histoire
        label: Histoire du club
        type: rich-text
        required: true
        options:
          format: html
          switcher: false
  # =========================
  # INFORMATIONS DU SITE
  # =========================

  - name: site
    label: Informations du site
    type: file
    path: assets/site.json
    format: json

    fields:
      - name: titreAccueil
        label: Titre de l'accueil
        type: string
        required: true

      - name: texteAccueil
        label: Texte sous le titre
        type: string
        required: true

      - name: bandeauActif
        label: Afficher le bandeau
        type: boolean
        required: true

      - name: bandeauTexte
        label: Texte du bandeau
        type: string
        required: false

  # =========================
  # INSCRIPTIONS
  # =========================

  - name: inscriptions
    label: Inscriptions 2026-2027
    type: file
    path: assets/inscriptions.json
    format: json

    fields:
      - name: actif
        label: Afficher les inscriptions sur le site
        type: boolean
        required: true

      - name: titre
        label: Titre
        type: string
        required: true

      - name: accroche
        label: Accroche
        type: string
        required: false

      - name: image
        label: Affiche
        type: image
        required: false
        options:
          media: inscriptions
          path: assets/inscriptions
          rename: safe

      - name: email
        label: Adresse e-mail inscriptions
        type: string
        required: true

      - name: contenu
        label: Texte de la page
        type: rich-text
        required: true
        options:
          format: html
          switcher: false

      - name: essais
        label: Dates des cours d'essai
        type: object
        list: true

        fields:
          - name: date
            label: Date
            type: date
            required: true

          - name: horaire
            label: Horaire
            type: string
            required: true

          - name: titre
            label: Libellé
            type: string
            required: true