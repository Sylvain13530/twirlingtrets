Pas encore. Il y a 2 erreurs importantes dans ce que tu as collé :

Dans .pages.yml, les fields de essais et de documents sont mélangés.

Dans inscriptions.html, le bloc documents est placé en dehors du .then(function(data){...}), donc le JavaScript est cassé.

Ton assets/inscriptions.json, lui, est syntaxiquement correct. Le bloc documents peut rester comme ça. Seul point à surveiller : si tu téléverses les PDF avec Pages CMS et rename: safe, le CMS peut renommer les fichiers ; laisse alors Pages CMS enregistrer lui-même leurs chemins plutôt que de forcer les noms actuels.

1. Corrige le bloc Inscriptions de .pages.yml
Remplace tout ton bloc Inscriptions par celui-ci :

