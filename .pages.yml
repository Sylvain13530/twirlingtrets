2. Ton HTML est bon jusqu'au script
La section :

<div id="documents-section" ...>
est bien placée. Tu peux la laisser.

En revanche, remplace tout ton <script> de inscriptions.html par celui-ci :

<script>
  (function () {

    fetch("assets/inscriptions.json", {
