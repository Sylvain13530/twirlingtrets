voici les 6 documents d'inscription, parcourt les et donne moi ton avis pour savoir si on les met tous en ligne ou non, ensuite on s'occupe de les mettre en ligne

J’ai parcouru les 6 PDF. Je ne les mettrais pas tous en ligne de la même manière. Certains sont clairement destinés aux familles, tandis que d’autres contiennent des informations nominatives qu’il vaut mieux ne pas publier sur un site public.

Ce que je mettrais en ligne
Document	En ligne ?	Pourquoi
Dossier de ré-inscription 2026-2027	Oui	C’est le document principal : fiche, pièces à fournir, cotisation et règlement intérieur.
QS-Sport mineur	Oui	Nécessaire aux familles pour déterminer si un certificat médical doit être fourni.
QS-Sport majeur	Oui	Même logique pour les licenciés majeurs.
Section loisirs 2026-2027	Oui	Très utile : matériel, tenue et règles pour les débutants/loisirs.
Section compétition 2026-2027	Oui, mais à corriger légèrement	Matériel, consignes et calendrier prévisionnel des compétitions : pertinent pour les familles.
Planning entraînement 2026-2027	Non dans sa forme actuelle	Il contient les prénoms des athlètes, leur groupe et leurs horaires. Je ne publierais pas ça sur le site public.
Le dossier de réinscription est particulièrement pertinent : il indique notamment les pièces obligatoires, la cotisation compétition de 180 €, les possibilités de paiement, les aides acceptées et les cautions. 

 Il comprend également le règlement intérieur, donc il peut parfaitement constituer le PDF principal à télécharger. 


Les deux QS-Sport doivent rester deux téléchargements séparés. Le questionnaire mineur précise que si toutes les réponses sont négatives, aucun certificat médical n’est à fournir ; en cas d’au moins une réponse positive, un certificat est demandé. 

 Le majeur suit le même principe. 


Planning : je ferais autrement
Le planning est intéressant pour le site, mais pas ce PDF. Il associe actuellement directement des prénoms d'enfants/athlètes aux créneaux et groupes, par exemple le lundi et le samedi. 


Je ferais plutôt une version publique directement dans la page Inscriptions, sans aucun prénom :

Lundi – Gymnase Burles
18h–19h : Débutants / Pass Twirl + groupes compétition
19h–20h : groupes compétition

Mercredi – Terrain de tennis Saint-Jean
18h–20h : préparation compétition N3/N2
En extérieur jusqu'au 14 octobre, sous réserve d'évolution du créneau.

Samedi – Gymnase Burles
9h–13h : gymnastique, twirling, solos/duos et équipes selon les groupes.

Le document précise d'ailleurs que le planning peut être ajusté en cours d'année. 

 On pourrait donc gérer ce planning via le CMS, plutôt que publier un PDF qui deviendra obsolète au premier changement.

Section compétition : une chose à régler avant publication
Le PDF contient les dates de championnat 2027, mais certaines sont explicitement indiquées comme restant à confirmer : Finale N2 5/6 juin ? et Finale N3 19/20 juin ?. 


Ce n’est pas bloquant si le document reste présenté comme prévisionnel, mais je mettrais clairement :

« Calendrier prévisionnel – certaines dates et certains lieux restent à confirmer. »

La fiche loisirs, elle, peut être publiée telle quelle sur le fond : elle donne le matériel nécessaire, les consignes et explique le cas d'un passage ultérieur vers la compétition avec le PASS TWIRL. 


Organisation que je recommande sur le site
Sur Inscriptions 2026-2027, je ne mettrais pas six gros boutons PDF sans hiérarchie. Je ferais une zone « Documents d'inscription » avec :

Dossier de ré-inscription 2026-2027 — bouton principal « Télécharger le dossier »

Questionnaire de santé — deux petits boutons « Mineur » / « Majeur »

Informations pratiques — « Section loisirs » / « Section compétition »

Planning des entraînements — affiché directement sur le site et administrable depuis le CMS, sans noms d'athlètes

Et surtout, je rendrais également cette liste de documents administrable depuis Pages CMS. L’année prochaine, vous remplacerez simplement les PDF 2026-2027 par ceux de 2027-2028 sans toucher au HTML.

C’est la structure que je retiendrais avant de commencer l’intégration.


On va faire ça proprement et durablement : Pages CMS gérera la liste des documents, et inscriptions.html les affichera automatiquement.

